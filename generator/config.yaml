kafka:
  brokers: kafka:9092
  schema_registry: http://schema-registry:8081

products:
  topic: shopify.products
  rate: 1/s
  seed_count: 100

inventory:
  topic: shopify.inventory
  rate: 10/s
  locations: 3

order_details:
  topic: shopify.order_details
  rate: 2/s

customers:
  topic: shopify.customers
  rate: 1/s

fraud:
  # Chance, per order-detail tick, of starting a new synthetic-fraud episode
  # when none is currently active.
  injection_probability: 0.01
  # How long a triggered episode concentrates order volume onto its target
  # customer (a detectable velocity burst).
  episode_duration: 20s
  # Chance an order-detail tick targets the customer with an active episode
  # instead of a uniformly random customer.
  target_weight: 0.7
